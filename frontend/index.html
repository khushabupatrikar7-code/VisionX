<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E1A1C;
    --surface: #16262A;
    --surface-2: #1D3236;
    --line: #2C4247;
    --text: #E9F2F1;
    --text-muted: #82A0A0;
    --accent: #35E0B6;
    --accent-2: #FFB454;
    --danger: #FF6B6B;
    --font-display: 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 20px 60px;
  }

  main { width: 100%; max-width: 640px; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  .wordmark { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.01em; margin: 0; }
  .wordmark span { color: var(--accent); }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--text-muted);
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 100px;
  }

  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); }
  .status-pill.live .dot { background: var(--accent); box-shadow: 0 0 0 3px rgba(53, 224, 182, 0.18); }
  .status-pill.err .dot { background: var(--danger); box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.18); }

  .viewfinder {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 4px;
    overflow: hidden;
  }

  video { width: 100%; height: 100%; object-fit: cover; display: block; }

  .bracket {
    position: absolute;
    width: 28px;
    height: 28px;
    border: 2px solid var(--accent);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .bracket.tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
  .bracket.tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
  .bracket.bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
  .bracket.br { bottom: 10px; right: 10px; border-left: none; border-top: none; }

  .viewfinder.flash .bracket { border-color: var(--accent-2); transform: scale(0.92); }

  @media (prefers-reduced-motion: reduce) { .bracket { transition: none; } }

  .frame-readout {
    position: absolute;
    bottom: 10px;
    left: 46px;
    right: 46px;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: rgba(233, 242, 241, 0.75);
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }

  button {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 0.92rem;
    padding: 14px 16px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease;
  }

  button:hover:not(:disabled) { background: var(--surface-2); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn-primary { background: var(--accent); color: #06231C; border-color: var(--accent); }
  .btn-primary:hover:not(:disabled) { background: #4CEBC5; }

  .btn-record.recording { background: var(--accent-2); color: #2A1700; border-color: var(--accent-2); }

  .log-header { margin-top: 28px; margin-bottom: 10px; font-size: 0.85rem; color: var(--text-muted); }

  #log {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    max-height: 320px;
    overflow-y: auto;
    padding: 4px;
  }

  .entry {
    display: flex;
    gap: 10px;
    padding: 10px 12px;
    border-left: 3px solid var(--line);
    font-family: var(--font-mono);
    font-size: 0.82rem;
    line-height: 1.5;
  }

  .entry + .entry { border-top: 1px solid var(--line); }
  .entry .time { color: var(--text-muted); flex-shrink: 0; }
  .entry .msg { color: var(--text); word-break: break-word; }

  .entry.kind-scene { border-left-color: var(--accent); }
  .entry.kind-text { border-left-color: var(--accent); }
  .entry.kind-video { border-left-color: var(--accent-2); }
  .entry.kind-live { border-left-color: var(--accent-2); }
  .entry.kind-error { border-left-color: var(--danger); }
  .entry.kind-error .msg { color: var(--danger); }
  .entry.kind-meta .msg { color: var(--text-muted); font-style: italic; }

  @media (max-width: 480px) { .controls { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<main>
  <header>
    <p class="wordmark">Vision<span>X</span></p>
    <div class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText">Connecting</span></div>
  </header>

  <div class="viewfinder" id="viewfinder">
    <video id="video" autoplay muted playsinline></video>
    <div class="bracket tl"></div>
    <div class="bracket tr"></div>
    <div class="bracket bl"></div>
    <div class="bracket br"></div>
    <div class="frame-readout" id="frameReadout">loading camera</div>
  </div>
  <canvas id="canvas" style="display:none;"></canvas>

  <div class="controls">
    <button id="btnScene" class="btn-primary" onclick="sendAction('describe_scene')" disabled>Describe scene</button>
    <button id="btnText" onclick="sendAction('read_text')" disabled>Read text</button>
    <button id="btnVideo" onclick="describeVideo()" disabled>Detect change</button>
    <button id="btnRecord" class="btn-record" onclick="toggleRecording()" disabled>Start recording</button>
  </div>

  <p class="log-header">Activity</p>
  <div id="log"></div>
</main>

<script>
  const SERVER_IP = "localhost";
  const ws = new WebSocket(`ws://${SERVER_IP}:8000/ws/stream`);
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const log = document.getElementById('log');
  const viewfinder = document.getElementById('viewfinder');
  const frameReadout = document.getElementById('frameReadout');
  const statusPill = document.getElementById('statusPill');
  const statusText = document.getElementById('statusText');
  const btnScene = document.getElementById('btnScene');
  const btnText = document.getElementById('btnText');
  const btnVideo = document.getElementById('btnVideo');
  const btnRecord = document.getElementById('btnRecord');

  let cameraReady = false;
  let waitingForResponse = false;
  let isRecording = false;
  let recordingInterval = null;

  function setPill(state, text) {
    statusPill.classList.remove('live', 'err');
    if (state) statusPill.classList.add(state);
    statusText.textContent = text;
  }

  ws.onopen = () => setPill('live', 'Connected');
  ws.onclose = () => setPill('err', 'Disconnected');
  ws.onerror = () => setPill('err', 'Connection error');

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    const kindMap = {
      describe_scene: 'scene',
      read_text: 'text',
      describe_video: 'video',
      live_update: 'live',
      recording_stopped: 'meta'
    };
    addLog(data.text, kindMap[data.type] || 'meta');
    if (data.action === 'speak') speakText(data.text);

    if (data.type === 'live_update' || data.type === 'recording_stopped') return;
    waitingForResponse = false;
    setButtonsEnabled(true);
  };

  navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => {
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        cameraReady = true;
        frameReadout.textContent = `camera ready — ${video.videoWidth}×${video.videoHeight}`;
        setButtonsEnabled(true);
      };
    })
    .catch(err => {
      frameReadout.textContent = 'camera access denied';
      addLog('Camera access denied: ' + err, 'error');
    });

  function setButtonsEnabled(enabled) {
    const ok = enabled && cameraReady && !waitingForResponse && !isRecording;
    btnScene.disabled = !ok;
    btnText.disabled = !ok;
    btnVideo.disabled = !ok;
    btnRecord.disabled = !enabled || !cameraReady;
  }

  function timestamp() {
    const d = new Date();
    return d.toTimeString().slice(0, 8);
  }

  function addLog(text, kind) {
    const entry = document.createElement('div');
    entry.className = `entry kind-${kind || 'meta'}`;
    entry.innerHTML = `<span class="time">${timestamp()}</span><span class="msg">${text}</span>`;
    log.appendChild(entry);
    log.scrollTop = log.scrollHeight;
  }

  function flashViewfinder() {
    viewfinder.classList.add('flash');
    setTimeout(() => viewfinder.classList.remove('flash'), 180);
  }

  function captureFrameBlob() {
    flashViewfinder();
    return new Promise((resolve) => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.9);
    });
  }

  function armTimeout() {
    setTimeout(() => {
      if (waitingForResponse) {
        addLog('No response after 20 seconds — check the backend terminal', 'error');
        waitingForResponse = false;
        setButtonsEnabled(true);
      }
    }, 20000);
  }

  async function sendAction(action) {
    if (!cameraReady || video.videoWidth === 0) { addLog('Camera not ready yet', 'error'); return; }
    const blob = await captureFrameBlob();
    if (!blob || blob.size === 0) { addLog('Failed to capture frame', 'error'); return; }

    waitingForResponse = true;
    setButtonsEnabled(false);
    ws.send(action);
    ws.send(blob);
    addLog(`Sent ${action.replace('_', ' ')} — waiting for response`, 'meta');
    armTimeout();
  }

  async function describeVideo() {
    if (!cameraReady || video.videoWidth === 0) { addLog('Camera not ready yet', 'error'); return; }

    waitingForResponse = true;
    setButtonsEnabled(false);
    addLog('Capturing start frame', 'meta');
    const startBlob = await captureFrameBlob();

    addLog('Waiting 2.5s — move or change something now', 'meta');
    await new Promise(r => setTimeout(r, 2500));

    addLog('Capturing end frame', 'meta');
    const endBlob = await captureFrameBlob();

    ws.send('describe_video');
    ws.send(startBlob);
    ws.send(endBlob);
    addLog('Sent for comparison — waiting for response', 'meta');
    armTimeout();
  }

  function toggleRecording() {
    if (!isRecording) {
      isRecording = true;
      btnRecord.textContent = 'Stop recording';
      btnRecord.classList.add('recording');
      setButtonsEnabled(true);
      ws.send('start_recording');
      addLog('Recording started — sending a frame every 3 seconds', 'meta');

      recordingInterval = setInterval(async () => {
        const blob = await captureFrameBlob();
        ws.send('live_frame');
        ws.send(blob);
      }, 3000);
    } else {
      isRecording = false;
      btnRecord.textContent = 'Start recording';
      btnRecord.classList.remove('recording');
      clearInterval(recordingInterval);
      ws.send('stop_recording');
      addLog('Recording stopped', 'meta');
      setButtonsEnabled(true);
    }
  }

  function speakText(text) {
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
  }
</script>

</body>
</html>
